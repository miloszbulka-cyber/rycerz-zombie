
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rycerz kontra Zombie 3D</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #101510;
    color: white;
    font-family: Arial, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
}

#menu {
    position: fixed;
    inset: 0;
    background: linear-gradient(
        rgba(5, 10, 8, 0.55),
        rgba(5, 10, 8, 0.95)
    );
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
}

#menuContent {
    padding: 30px;
}

h1 {
    color: #e9c46a;
    font-size: clamp(30px, 6vw, 65px);
    text-shadow: 0 0 20px #000;
}

button {
    background: #c79b43;
    border: none;
    padding: 15px 35px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 6px;
}

button:hover {
    background: #f4d58d;
}

#hud {
    display: none;
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 5;
    background: rgba(0,0,0,0.65);
    padding: 15px;
    border-radius: 8px;
    line-height: 1.8;
}

#crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #e9c46a;
    font-size: 30px;
    pointer-events: none;
}

#help {
    position: fixed;
    bottom: 15px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ddd;
    pointer-events: none;
}

#message {
    color: #e9c46a;
    margin: 15px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="menu">
    <div id="menuContent">
        <h1>RYCERZ KONTRA ZOMBIE</h1>
        <p>Przetrwaj w królestwie umarłych.</p>
        <p id="message">Gotowy do walki?</p>
        <button id="start">NOWA GRA</button>
    </div>
</div>

<div id="hud">
    <div>Punkty: <span id="score">0</span></div>
    <div>Zdrowie: <span id="health">100</span></div>
    <div>Fala: <span id="wave">1</span></div>
    <div>Zombie: <span id="enemies">0</span></div>
</div>

<div id="crosshair">+</div>

<div id="help">
    WASD — ruch | SPACJA / kliknięcie — atak | ESC — pauza
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.min.js"></script>

<script>
const game = document.getElementById("game");
const menu = document.getElementById("menu");
const hud = document.getElementById("hud");
const startButton = document.getElementById("start");

const scoreText = document.getElementById("score");
const healthText = document.getElementById("health");
const waveText = document.getElementById("wave");
const enemiesText = document.getElementById("enemies");
const message = document.getElementById("message");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x17251d);
scene.fog = new THREE.Fog(0x17251d, 20, 80);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    150
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

game.appendChild(renderer.domElement);

// Światło
scene.add(new THREE.HemisphereLight(0xb9d4df, 0x25351f, 2));

const sunlight = new THREE.DirectionalLight(0xffe0a1, 3);
sunlight.position.set(-15, 30, 15);
sunlight.castShadow = true;
scene.add(sunlight);

// Podłoże
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({
        color: 0x344832,
        roughness: 1
    })
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Elementy mapy
for (let i = 0; i < 80; i++) {
    const stone = new THREE.Mesh(
        new THREE.DodecahedronGeometry(
            0.3 + Math.random() * 0.8
        ),
        new THREE.MeshStandardMaterial({
            color: 0x50574c
        })
    );

    stone.position.set(
        (Math.random() - 0.5) * 100,
        0.3,
        (Math.random() - 0.5) * 100
    );

    stone.castShadow = true;
    scene.add(stone);
}

// Zamek
function createCastle() {
    const material = new THREE.MeshStandardMaterial({
        color: 0x5a5c55
    });

    const castle = new THREE.Group();

    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(18, 7, 2),
        material
    );

    wall.position.set(0, 3.5, -30);
    castle.add(wall);

    for (let x of [-8, 8]) {
        const tower = new THREE.Mesh(
            new THREE.CylinderGeometry(2, 2.5, 12, 8),
            material
        );

        tower.position.set(x, 6, -30);
        castle.add(tower);
    }

    scene.add(castle);
}

createCastle();

// Rycerz
function createKnight() {
    const knight = new THREE.Group();

    const armor = new THREE.MeshStandardMaterial({
        color: 0x71849b,
        metalness: 0.6,
        roughness: 0.4
    });

    const darkArmor = new THREE.MeshStandardMaterial({
        color: 0x35455a,
        metalness: 0.4
    });

    const skin = new THREE.MeshStandardMaterial({
        color: 0xc5a17b
    });

    function part(geometry, material, x, y, z) {
        const mesh = new THREE.Mesh(geometry, material);

        mesh.position.set(x, y, z);
        mesh.castShadow = true;

        knight.add(mesh);

        return mesh;
    }

    // Ciało
    part(
        new THREE.BoxGeometry(1.2, 1.6, 0.7),
        armor,
        0, 1.7, 0
    );

    // Hełm
    part(
        new THREE.BoxGeometry(0.9, 0.9, 0.9),
        armor,
        0, 3, 0
    );

    part(
        new THREE.BoxGeometry(0.7, 0.15, 0.1),
        darkArmor,
        0, 2.9, 0.48
    );

    // Nogi
    part(
        new THREE.BoxGeometry(0.45, 1.1, 0.5),
        darkArmor,
        -0.35, 0.55, 0
    );

    part(
        new THREE.BoxGeometry(0.45, 1.1, 0.5),
        darkArmor,
        0.35, 0.55, 0
    );

    // Tarcza
    part(
        new THREE.BoxGeometry(0.8, 1.2, 0.15),
        new THREE.MeshStandardMaterial({
            color: 0x9b6338
        }),
        -0.85, 1.7, 0
    );

    // Miecz
    const sword = new THREE.Group();

    const blade = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 2.2, 0.2),
        new THREE.MeshStandardMaterial({
            color: 0xe2e8ee,
            metalness: 0.8
        })
    );

    blade.position.y = 1.1;
    sword.add(blade);

    const handle = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 0.15, 0.3),
        new THREE.MeshStandardMaterial({
            color: 0x8b5e35
        })
    );

    sword.add(handle);

    sword.position.set(0.85, 1.4, 0.4);
    sword.rotation.z = -0.5;

    knight.add(sword);

    knight.userData.sword = sword;

    scene.add(knight);

    return knight;
}

const knight = createKnight();

// Zombie
function createZombie() {
    const zombie = new THREE.Group();

    const green = new THREE.MeshStandardMaterial({
        color: 0x718d4b
    });

    const darkGreen = new THREE.MeshStandardMaterial({
        color: 0x394d2c
    });

    function part(geometry, material, x, y, z) {
        const mesh = new THREE.Mesh(geometry, material);

        mesh.position.set(x, y, z);
        mesh.castShadow = true;

        zombie.add(mesh);

        return mesh;
    }

    part(
        new THREE.BoxGeometry(1.1, 1.5, 0.7),
        green,
        0, 1.4, 0
    );

    part(
        new THREE.BoxGeometry(0.9, 0.9, 0.9),
        green,
        0, 2.6, 0
    );

    part(
        new THREE.BoxGeometry(0.15, 0.15, 0.1),
        darkGreen,
        -0.2, 2.7, 0.48
    );

    part(
        new THREE.BoxGeometry(0.15, 0.15, 0.1),
        darkGreen,
        0.2, 2.7, 0.48
    );

    part(
        new THREE.BoxGeometry(0.35, 1, 0.4),
        darkGreen,
        -0.3, 0.5, 0
    );

    part(
        new THREE.BoxGeometry(0.35, 1, 0.4),
        darkGreen,
        0.3, 0.5, 0
    );

    scene.add(zombie);

    zombie.userData.health = 1;
    zombie.userData.speed = 2 + Math.random();

    return zombie;
}

// Stan gry
let zombies = [];
let score = 0;
let health = 100;
let wave = 1;
let gameRunning = false;
let spawnTimer = 0;
let attackCooldown = 0;
let attackAnimation = 0;

const keys = {};

let playerDirection = 0;

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        e.preventDefault();
        attack();
    }

    if (e.key === "Escape" && gameRunning) {
        pauseGame();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
    if (gameRunning) pauseGame();
});

startButton.onclick = () => {
    if (gameRunning) return;

    restartGame();
};

function restartGame() {
    zombies.forEach(z => scene.remove(z));
    zombies = [];

    score = 0;
    health = 100;
    wave = 1;

    knight.position.set(0, 0, 0);
    knight.rotation.y = 0;

    playerDirection = 0;

    spawnTimer = 0;
    attackCooldown = 0;
    attackAnimation = 0;

    gameRunning = true;

    menu.style.display = "none";
    hud.style.display = "block";

    updateUI();
}

function pauseGame() {
    gameRunning = false;
    menu.style.display = "flex";
    hud.style.display = "none";

    message.textContent = "Gra zatrzymana";
    startButton.textContent = "WRÓĆ DO GRY";
}

function updateUI() {
    scoreText.textContent = score;
    healthText.textContent = Math.ceil(health);
    waveText.textContent = wave;
    enemiesText.textContent = zombies.length;
}

function attack() {
    if (!gameRunning || attackCooldown > 0) return;

    attackCooldown = 0.6;
    attackAnimation = 0.3;

    knight.userData.sword.rotation.z = -1.8;

    zombies.forEach(z => {
        const dx = z.position.x - knight.position.x;
        const dz = z.position.z - knight.position.z;

        const distance = Math.hypot(dx, dz);

        if (distance < 4) {
            z.userData.health -= 1;

            if (z.userData.health <= 0) {
                score += 10;
                scene.remove(z);
            }
        }
    });

    zombies = zombies.filter(z => z.userData.health > 0);

    updateUI();
}

function spawnZombie() {
    const zombie = createZombie();

    const angle = Math.random() * Math.PI * 2;
    const distance = 20 + Math.random() * 10;

    zombie.position.set(
        knight.position.x + Math.cos(angle) * distance,
        0,
        knight.position.z + Math.sin(angle) * distance
    );

    zombies.push(zombie);
}

function update(dt) {
    if (!gameRunning) return;

    let dx = 0;
    let dz = 0;

    if (keys["w"] || keys["arrowup"]) dz -= 1;
    if (keys["s"] || keys["arrowdown"]) dz += 1;
    if (keys["a"] || keys["arrowleft"]) dx -= 1;
    if (keys["d"] || keys["arrowright"]) dx += 1;

    if (dx || dz) {
        const length = Math.hypot(dx, dz);

        dx /= length;
        dz /= length;

        knight.position.x += dx * 7 * dt;
        knight.position.z += dz * 7 * dt;

        playerDirection = Math.atan2(dx, dz);
        knight.rotation.y = playerDirection;
    }

    attackCooldown = Math.max(0, attackCooldown - dt);
    attackAnimation = Math.max(0, attackAnimation - dt);

    if (attackAnimation <= 0) {
        knight.userData.sword.rotation.z = -0.5;
    }

    spawnTimer += dt;

    if (spawnTimer > Math.max(0.5, 2 - wave * 0.1)) {
        spawnZombie();
        spawnTimer = 0;
    }

    zombies.forEach(z => {
        const dx = knight.position.x - z.position.x;
        const dz = knight.position.z - z.position.z;

        const distance = Math.hypot(dx, dz);

        if (distance > 1.5) {
            z.position.x += dx / distance * z.userData.speed * dt;
            z.position.z += dz / distance * z.userData.speed * dt;
        }

        if (distance < 2) {
            health -= 15 * dt;
            updateUI();
        }
    });

    wave = Math.floor(score / 100) + 1;

    if (health <= 0) {
        health = 0;
        gameRunning = false;

        menu.style.display = "flex";
        hud.style.display = "none";

        message.textContent = "Koniec gry! Zdobyte punkty: " + score;
        startButton.textContent = "ZAGRAJ PONOWNIE";
    }

    updateUI();
}

// Kamera za rycerzem
function updateCamera() {
    const distance = 9;
    const height = 5;

    const targetX = knight.position.x -
        Math.sin(playerDirection) * distance;

    const targetZ = knight.position.z -
        Math.cos(playerDirection) * distance;

    camera.position.x += (targetX - camera.position.x) * 0.1;
    camera.position.y += (height - camera.position.y) * 0.1;
    camera.position.z += (targetZ - camera.position.z) * 0.1;

    camera.lookAt(
        knight.position.x,
        knight.position.y + 2,
        knight.position.z
    );
}

let lastTime = performance.now();

function animate(time) {
    requestAnimationFrame(animate);

    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    update(dt);
    updateCamera();

    renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate(performance.now());
</script>

</body>
</html>
